project:
  type: book
  output-dir: docs

book:
  title: "Probabilità per la psicologia"
  subtitle: "Modulo di richiamo"
  license: "Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International (CC BY-NC-ND 4.0)"
  reader-mode: true
  google-analytics: G-QT5S3P9D31
  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"
  date: "last-modified"
  search: true
  repo-url: https://github.com/ccaudek/utet-prob/
  repo-actions: [source, issue]
  back-to-top-navigation: true
  site-url: https://ccaudek.github.io/utet-prob/
  page-footer:
    left: |
      **Probabilità per la psicologia** — Modulo di richiamo del progetto UTET a supporto del manuale *Metodi bayesiani in psicologia*.
    right: |
      Realizzato con <a href="https://quarto.org/">Quarto</a>.
  favicon: style/gauss.png
  sidebar:
    # style: "docked"
    search: true
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "PARTE 1: Fondamenti della probabilità"
      chapters:
        - chapters/probability/01_intro_prob_bayesian.qmd
        - chapters/probability/02_axioms_coherence_bayesian.qmd
        - chapters/probability/03_equiprobability_combinatorics_bayesian.qmd
        - chapters/probability/04_conditional_prob_bayesian.qmd
        - chapters/probability/05_bayes_theorem.qmd
    - part: "PARTE 2: Variabili casuali e distribuzioni"
      chapters:
        - chapters/probability/06_random_var.qmd
        - chapters/probability/07_prob_distributions.qmd
        - chapters/probability/08_expval_var.qmd
        - chapters/probability/09_cov_cor.qmd
    - part: "PARTE 3: Distribuzioni specifiche"
      chapters:
        - chapters/probability/10_dal_dato_ipotesi.qmd
        - chapters/probability/11_intro_distributions.qmd
        - chapters/probability/12_discr_rv_distr.qmd
        - chapters/probability/13_cont_rv_distr.qmd
    - part: "PARTE 4: Verso l'inferenza"
      chapters:
        - chapters/probability/14_likelihood.qmd
        - chapters/probability/15_properties_likelihood.qmd
  appendices:
    - chapters/appendix/a02_math_symbols.qmd
    - chapters/appendix/a11_numbers.qmd
    - chapters/appendix/a12_sum_notation.qmd
    - chapters/appendix/a13_sets.qmd
    - chapters/appendix/a14_combinatorics.qmd
    - chapters/appendix/a15_calculus.qmd

# Crossref va al livello root (fuori da book:)
crossref:
  appendix-title: "Appendice"

bibliography: ./references.bib
biblio-style: apalike
csl: apa.csl
link-citations: true
google-scholar: true

format:
  html:
    # -------- Codice --------
    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: scroll
    code-block-bg: true
    
    # -------- Tema --------
    theme:
      light: cosmo
      dark: darkly
    css: style/custom.css
    mainfont: "system-ui"
    lang: it
    
    # -------- Navigazione --------
    reader-mode: true
    toc: true              # TOC va qui sotto format:html:
    toc-depth: 2           # E anche toc-depth
    toc-title: "Sommario"
    smooth-scroll: true
    
    # -------- Link e note --------
    footnotes-hover: true
    link-external-icon: true
    link-external-newwindow: true
    
    # -------- Media --------
    lightbox: auto
    
    # -------- Matematica --------
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
      # Macro opzionali (decommentare se serve)
      # macros:
      #   "\\E": "\\mathbb{E}"
      #   "\\Var": "\\mathrm{Var}"
      #   "\\Cov": "\\mathrm{Cov}"

execute:
  # -------- Gestione cache --------
  # freeze: auto mantiene output per deploy
  # cache: true velocizza rendering durante sviluppo
  freeze: auto
  cache: false           # Puoi mettere true per velocizzare rendering
  cache.lazy: false
  
  # -------- Output messaggi --------
  echo: true
  warning: false
  message: false
  error: false
  
  # -------- Console R --------
  options:
    width: 120
    pillar.width: Inf
    tibble.width: Inf

website:
  cookie-consent:
    type: express
    style: headline
    anonymize-ip: true
