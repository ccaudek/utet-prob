project:
  type: book
  output-dir: docs

lang: it

book:
  title: "Probabilità per la psicologia"
  subtitle: "Modulo di richiamo"
  description: |
    Modulo di richiamo sulla probabilità per la psicologia, parte del progetto UTET a supporto del manuale Metodi bayesiani in psicologia.

  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"

  date: last-modified
  date-format: "DD MMMM YYYY"
  license: "CC BY-NC-ND"

  site-url: https://ccaudek.github.io/utet-prob/
  repo-url: https://github.com/ccaudek/utet-prob/
  repo-actions: [source, issue]

  favicon: style/gauss.png

  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    location: sidebar
    type: overlay
    copy-button: true
    show-item-context: true

  sidebar:
    collapse-level: 1

  google-analytics:
    tracking-id: "G-QT5S3P9D31"
    anonymize-ip: true

  cookie-consent:
    type: express
    style: headline
    palette: light
    language: it
    prefs-text: "Preferenze cookie"

  open-graph: true
  twitter-card: true

  page-footer:
    left: |
      **Probabilità per la psicologia** — Modulo di richiamo del progetto UTET a supporto del manuale *Metodi bayesiani in psicologia*.
    right: |
      Realizzato con [Quarto](https://quarto.org/).

  chapters:
    - index.qmd

    - part: "PARTE 1: Fondamenti della probabilità"
      chapters:
        - chapters/probability/01_intro_prob_bayesian.qmd
        - chapters/probability/02_axioms_coherence_bayesian.qmd
        - chapters/probability/03_equiprobability_combinatorics_bayesian.qmd
        - chapters/probability/04_conditional_prob_bayesian.qmd
        - chapters/probability/05_bayes_theorem.qmd

    - part: "PARTE 2: Variabili casuali e distribuzioni"
      chapters:
        - chapters/probability/06_random_var.qmd
        - chapters/probability/07_prob_distributions.qmd
        - chapters/probability/08_expval_var.qmd
        - chapters/probability/09_cov_cor.qmd

    - part: "PARTE 3: Distribuzioni specifiche"
      chapters:
        - chapters/probability/10_intro_distributions.qmd
        - chapters/probability/11_discr_rv_distr.qmd
        - chapters/probability/12_cont_rv_distr.qmd

    - part: "PARTE 4: Verso l'inferenza"
      chapters:
        - chapters/probability/13_from_sample_to_evidence.qmd
        - chapters/probability/14_likelihood.qmd
        - chapters/probability/15_aggiornamento_bayesiano.qmd
        - chapters/probability/16_conclusioni.qmd

  appendices:
    - chapters/appendix/a02_math_symbols.qmd
    - chapters/appendix/a11_numbers.qmd
    - chapters/appendix/a12_sum_notation.qmd
    - chapters/appendix/a13_sets.qmd
    - chapters/appendix/a14_combinatorics.qmd
    - chapters/appendix/a15_calculus.qmd

crossref:
  appendix-title: "Appendice"

bibliography: references.bib
csl: apa.csl
link-citations: true
google-scholar: true

format:
  html:
    highlight-style: arrow

    theme:
      light:
        - cosmo
        - style/custom.scss
      dark:
        - darkly
        - style/custom.scss
        - style/custom-dark.scss

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-location: right
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: wrap
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/utet-prob/"

    html-math-method: 
      method: mathjax
      mathjax:
        config: TeX-AMS_CHTML
        options:
          font: "Latin-Modern"


  pdf:
    documentclass: scrbook
    classoption:
      - a4paper
      - 11pt
      - open=any            # i capitoli non iniziano forzatamente a pagina dispari
                            # (evita pagine bianche: sensato per un PDF letto a schermo;
                            # per la stampa tipografica rimuovere questa riga)
    pdf-engine: lualatex    
    mainfont: "Libertinus Serif"   # copertura IAST completa; alternative: "Gentium Plus",
    sansfont: "Libertinus Sans"    # "EB Garamond", "Charis SIL"
    lang: it                # se non è già a livello di progetto: attiva sillabazione
                            # italiana e traduce "Indice", "Capitolo", ecc.
    toc: true
    toc-depth: 2
    number-sections: true

    colorlinks: true
    linkcolor: MidnightBlue    # più sobrio del blu acceso predefinito
    citecolor: MidnightBlue
    urlcolor: MidnightBlue

    geometry:
      - top=25mm
      - bottom=25mm
      - inner=30mm           # con scrbook (twoside) inner/outer è più corretto
      - outer=25mm           # di left/right: il margine interno assorbe la rilegatura

    include-in-header:
      text: |
        \usepackage[automark]{scrlayer-scrpage}  % testatine correnti (capitolo/sezione)
        \clubpenalty=10000                        % niente righe orfane
        \widowpenalty=10000                       % niente righe vedove


execute:
  freeze: auto
  cache: false

  echo: true
  warning: false
  message: false
  error: false

  fig.width: 6.5
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold

  options:
    width: 90
    pillar.width: 90
    tibble.width: 90

