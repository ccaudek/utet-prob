project:
  type: book
  output-dir: docs

book:
  title: "Probabilità per la psicologia"
  subtitle: "Modulo di richiamo"
  license: "Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International (CC BY-NC-ND 4.0)"
  reader-mode: true
  google-analytics: G-QT5S3P9D31

  author: 
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"
  date: "last-modified"
  search: true
  repo-url: https://github.com/ccaudek/utet-prob/
  repo-actions: [source, issue]
  back-to-top-navigation: true
  site-url: https://ccaudek.github.io/utet-prob/
  page-footer:
    left: |
      **Probabilità per la psicologia** — Modulo di richiamo del progetto UTET a supporto del manuale *Metodi bayesiani in psicologia*.
    right: |
      Realizzato con <a href="https://quarto.org/">Quarto</a>.
  favicon: style/gauss.png
  
  sidebar:
    # style: "docked"
    search: true
    collapse-level: 1

  chapters:
    - index.qmd

    - part: chapters/probability/introduction_probability.qmd
      chapters:
        - chapters/probability/01_intro_prob_bayesian.qmd
        - chapters/probability/02_axioms_coherence_bayesian.qmd
        - chapters/probability/03_equiprobability_combinatorics_bayesian.qmd
        - chapters/probability/04_conditional_prob_bayesian.qmd
        - chapters/probability/05_bayes_theorem.qmd
        - chapters/probability/06_random_var.qmd
        - chapters/probability/07_prob_distributions.qmd
        - chapters/probability/08_expval_var.qmd
        - chapters/probability/09_dal_dato_ipotesi.qmd
        - chapters/probability/10_cov_cor.qmd
        - chapters/probability/11_intro_distributions.qmd
        - chapters/probability/12_discr_rv_distr.qmd
        - chapters/probability/13_cont_rv_distr.qmd
        - chapters/probability/14_likelihood.qmd
        - chapters/probability/15_properties_likelihood.qmd

  appendices:
    - chapters/appendix/a02_math_symbols.qmd
    - chapters/appendix/a11_numbers.qmd
    - chapters/appendix/a12_sum_notation.qmd
    - chapters/appendix/a13_sets.qmd
    - chapters/appendix/a14_combinatorics.qmd
    - chapters/appendix/a15_calculus.qmd

crossref:
  appendix-title: "Appendice"

toc: true
toc-depth: 2

bibliography: ./references.bib
biblio-style: apalike
csl: apa.csl
link-citations: true

google-scholar: true

format:
  html:
    code-fold: false
    code-summary: "Code show/hide"
    code-copy: hover
    code-link: true
    code-overflow: scroll
    code-block-bg: true
    theme: 
      light: 
        - cosmo
      dark: darkly
    mainfont: "system-ui"
    lang: it
    reader-mode: true
    # toc: true
    toc-title: "Sommario"
    # toc-expand: 2
    smooth-scroll: true
    footnotes-hover: true
    link-external-icon: true
    link-external-newwindow: true

    # Figure 
    fig-align: center
    fig-responsive: true
    fig-cap-location: bottom
    fig-format: png 
  
    # Matematica
    html-math-method:
      method: mathjax
      # macros: { "\\E": "\\mathbb{E}", "\\Var": "\\mathrm{Var}" }

    # Media
    lightbox: auto

execute:
  freeze: auto  # Skip re-executing unchanged code chunks
  echo: true  # Display code in the output document
  warning: false  # Suppress warnings in output
  message: false  # Suppress messages in output
  fig.width: 6  # Set figure width (in inches)
  fig.asp: 0.618  # Set figure aspect ratio (golden ratio for aesthetics)
  fig.retina: 2  # High resolution for retina displays
  fig.align: "center"  # Center-align all figures
  fig.show: "hold"  # Group multiple figures from a chunk
  options:
    width: 120            # allarga la console virtuale
    pillar.width: Inf      # disattiva il riassunto colonne
    tibble.width: Inf      # idem, per sicurezza

website:
  cookie-consent:
    type: express
    style: headline
    anonymize-ip: true
